[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "project-doctor"
version = "0.1.0"
description = "Scan a project or GitHub repo and report what is broken, missing or risky."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Muhammad Ansar", email = "" }]
keywords = ["linter", "audit", "cli", "github", "code-quality", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.5,<1"]

[project.urls]
Homepage = "https://github.com/Not-Muhib/project-doctor"
Issues = "https://github.com/Not-Muhib/project-doctor/issues"

[project.scripts]
project-doctor = "project_doctor.cli:main"
pdoc-scan = "project_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
